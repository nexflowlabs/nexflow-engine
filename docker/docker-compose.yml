# Nexflow Engine + Postgres + Mock AI server
# Usage: from repo root, run:
#   cd docker && docker-compose up -d
# Then run engine with: spring.profiles.active=prod and nexflow.ai-decision.url=http://mock-ai:8090/confidence

version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: nexflow
      POSTGRES_USER: nexflow
      POSTGRES_PASSWORD: nexflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  mock-ai:
    build: ./mock-ai-server
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/health"]
      interval: 5s
      timeout: 3s
      retries: 3

  # Engine is typically run on host with: mvn spring-boot:run -Dspring-boot.run.profiles=prod
  # and DATABASE_URL / nexflow.ai-decision.url pointing to postgres and mock-ai.
  # Uncomment below to run engine in Docker (build from parent pom first).
  # engine:
  #   build:
  #     context: ..
  #     dockerfile: docker/Dockerfile.engine
  #   environment:
  #     SPRING_PROFILES_ACTIVE: prod
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/nexflow
  #     SPRING_DATASOURCE_USERNAME: nexflow
  #     SPRING_DATASOURCE_PASSWORD: nexflow
  #     NEXFLOW_AI_DECISION_URL: http://mock-ai:8090/confidence
  #   ports:
  #     - "8080:8080"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     mock-ai:
  #       condition: service_healthy
